# EXAMPLE ONLY — merge into an exported URL map from:
#   gcloud compute url-maps export YOUR_MAP --destination=map.yaml --global
#
# A URL map must have either defaultService OR defaultUrlRedirect (not both in
# the same way for all cases). This fragment shows pathRules with 301 redirect.
# Replace self-links with values from your exported map (project, backend IDs).

