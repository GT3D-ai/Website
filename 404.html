<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      /* GCS serves this document for missing paths; the browser URL can be deep under the bucket, which breaks relative CSS/asset URLs unless the base is the bucket root. */
      (function () {
        if (location.hostname !== "storage.googleapis.com") return;
        var parts = location.pathname.split("/").filter(Boolean);
        if (parts.length < 1) return;
        var b = document.createElement("base");
        b.href = location.origin + "/" + parts[0] + "/";
        document.head.insertBefore(b, document.head.firstChild);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="favicon.png" type="image/png" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Ground Truth 3D</title>
    <meta name="description" content="The requested page could not be found." />
    <style>
      /* Fallback if styles.min.css fails to load (wrong relative path or network) */
      .page-404 .page-404-section {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: min(70vh, 560px);
        padding: 6rem 1.5rem;
        box-sizing: border-box;
      }
      .page-404-section__inner {
        width: 100%;
        max-width: 28rem;
        margin: 0 auto;
        text-align: center;
      }
      .page-404-section__visual {
        margin: 0 auto 2.5rem;
        max-width: 400px;
      }
      .page-404-section__visual img {
        width: 100%;
        height: auto;
        display: block;
        margin: 0 auto;
        border: 1px solid #e0e0e0;
        border-radius: 4px;
        background: #fafafa;
      }
      .page-404-section__title {
        margin: 0 0 1rem;
        font-size: clamp(1.5rem, 4vw, 1.75rem);
        font-weight: 600;
        letter-spacing: -0.02em;
        color: #0d0d0d;
      }
      .page-404-section__lede {
        margin: 0 0 2.5rem;
        font-size: 1rem;
        line-height: 1.6;
        color: #4a4a4a;
      }
      .page-404-section__actions {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        justify-content: center;
        align-items: center;
        margin: 0;
      }
    </style>
    <link rel="stylesheet" href="styles.min.css" />
</head>
  <body class="page-category page-404">
    <header class="site-header site-header--category">
      <div class="header-inner">
        <a class="logo" href="index.html"><img class="logo__mark" src="images/logo-mark.svg" alt="" width="36" height="36" decoding="async" /> Ground Truth <span>3D</span></a>
        <button
          type="button"
          class="menu-toggle"
          id="menu-toggle"
          aria-expanded="false"
          aria-controls="dropdown-menu"
          aria-label="Open menu"
        >
          <span class="bar" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <div class="dropdown-panel" id="dropdown-panel" hidden aria-hidden="true">
      <nav class="dropdown-inner" id="dropdown-menu" aria-label="Site menu">
        <a href="index.html">Home</a>
        <a href="Commercial_Existing_Conditions/index.html">Commercial Existing Conditions</a>
        <a href="Residential/index.html">Residential Existing Conditions</a>
        <a href="blog/index.html">Stories</a>
        <a href="Get_in_Touch/index.html">Get in Touch</a>
      </nav>
    </div>

    <main>
      <section class="page-404-section" aria-labelledby="page-404-title">
        <div class="page-404-section__inner">
          <div class="page-404-section__visual">
            <img
              src="images/404-placeholder.svg"
              alt=""
              width="400"
              height="300"
              decoding="async"
            />
          </div>
          <h1 id="page-404-title" class="page-404-section__title">Page not found</h1>
          <p class="page-404-section__lede">The page you’re looking for doesn’t exist or may have moved.</p>
          <p class="page-404-section__actions">
            <a class="btn btn-primary" href="index.html">Back to home</a>
            <a class="btn btn-outline" href="Get_in_Touch/index.html">Get in Touch</a>
          </p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <div class="footer-links">
          <ul>
            <li><a href="About_Us/index.html">About Ground Truth 3D</a></li>
            <li><a href="Get_in_Touch/index.html">Contact us</a></li>
            <li>
              <a href="https://www.instagram.com/groundtruth3d/" rel="noopener noreferrer" target="_blank">Instagram</a>
            </li>
            <li><a href="index.html">Home</a></li>
          </ul>
        </div>
      </div>
    </footer>

    <script>
      (function () {
        var toggle = document.getElementById("menu-toggle");
        var panel = document.getElementById("dropdown-panel");
        if (!toggle || !panel) return;

        function setOpen(open) {
          toggle.setAttribute("aria-expanded", open ? "true" : "false");
          toggle.setAttribute("aria-label", open ? "Close menu" : "Open menu");
          panel.hidden = !open;
          panel.setAttribute("aria-hidden", open ? "false" : "true");
          panel.classList.toggle("is-open", open);
          document.body.style.overflow = open ? "hidden" : "";
        }

        toggle.addEventListener("click", function () {
          setOpen(toggle.getAttribute("aria-expanded") !== "true");
        });

        panel.addEventListener("click", function (e) {
          if (e.target === panel) setOpen(false);
        });

        panel.querySelectorAll("a").forEach(function (link) {
          link.addEventListener("click", function () {
            setOpen(false);
          });
        });

        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") setOpen(false);
        });
      })();
    </script>
    <script src="analytics.js" defer></script>
  </body>
</html>
