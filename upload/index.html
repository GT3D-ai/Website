<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="../favicon.png" type="image/png" />
    <title>Upload — Ground Truth 3D</title>
    <meta name="description" content="Upload project documentation." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="page-category page-upload">
    <header class="site-header site-header--category">
      <div class="header-inner">
        <a class="logo" href="../index.html"
          ><img
            class="logo__mark"
            src="../images/logo-mark.svg"
            alt=""
            width="36"
            height="36"
            decoding="async"
          />
          Ground Truth <span>3D</span></a
        >
        <button
          type="button"
          class="menu-toggle"
          id="menu-toggle"
          aria-expanded="false"
          aria-controls="dropdown-menu"
          aria-label="Open menu"
        >
          <span class="bar" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <div class="dropdown-panel" id="dropdown-panel" hidden aria-hidden="true">
      <nav class="dropdown-inner" id="dropdown-menu" aria-label="Site menu">
        <a href="../index.html">Home</a>
        <a href="../Get_in_Touch/index.html">Get in Touch</a>
      </nav>
    </div>

    <main class="upload-main">
      <div class="upload-inner">
        <header class="upload-project-header">
          <h1 class="upload-project-title" id="upload-headline">Project</h1>
          <p class="upload-project-subtitle" id="upload-subheadline"></p>
        </header>

        <p class="upload-fallback" id="upload-fallback" hidden>
          No project was loaded. <a href="../new-project/index.html">Create a project</a> or return to the
          <a href="../index.html">home page</a>.
        </p>

        <section class="upload-placeholder-section" id="upload-placeholder" aria-label="Upload files" hidden>
          <p class="upload-placeholder-note">File upload can be connected here.</p>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <div class="footer-links">
          <ul>
            <li><a href="../About_Us/index.html">About Ground Truth 3D</a></li>
            <li><a href="../Get_in_Touch/index.html">Contact us</a></li>
            <li><a href="../index.html">Home</a></li>
          </ul>
        </div>
      </div>
    </footer>

    <script src="../js/projects-flow.js"></script>
    <script>
      (function () {
        var toggle = document.getElementById("menu-toggle");
        var panel = document.getElementById("dropdown-panel");
        if (toggle && panel) {
          function setOpen(open) {
            toggle.setAttribute("aria-expanded", open ? "true" : "false");
            toggle.setAttribute("aria-label", open ? "Close menu" : "Open menu");
            panel.hidden = !open;
            panel.setAttribute("aria-hidden", open ? "false" : "true");
            panel.classList.toggle("is-open", open);
            document.body.style.overflow = open ? "hidden" : "";
          }
          toggle.addEventListener("click", function () {
            setOpen(toggle.getAttribute("aria-expanded") !== "true");
          });
          panel.addEventListener("click", function (e) {
            if (e.target === panel) setOpen(false);
          });
          panel.querySelectorAll("a").forEach(function (link) {
            link.addEventListener("click", function () {
              setOpen(false);
            });
          });
          document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") setOpen(false);
          });
        }
      })();
    </script>
    <script>
      (function () {
        var headline = document.getElementById("upload-headline");
        var sub = document.getElementById("upload-subheadline");
        var fallback = document.getElementById("upload-fallback");
        var placeholder = document.getElementById("upload-placeholder");

        if (!window.GT3DProjects) return;
        var data = window.GT3DProjects.getUploadSession();

        if (!data || !data.projectName) {
          if (headline) headline.textContent = "Upload";
          if (sub) sub.textContent = "";
          if (fallback) fallback.hidden = false;
          return;
        }

        if (headline) headline.textContent = data.projectName;
        if (sub) sub.textContent = data.address || "";
        document.title = data.projectName + " — Upload — Ground Truth 3D";

        if (fallback) fallback.hidden = true;
        if (placeholder) placeholder.hidden = false;

        window.GT3DProjects.addProject({
          id: data.pendingId,
          name: data.projectName,
          address: data.address || "",
        });
      })();
    </script>
  </body>
</html>
